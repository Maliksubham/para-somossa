<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>পাড়ার সমস্যা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f6f2;--card:#fff;--ink:#14263a;--mute:#5d6b78;--line:#d5dbd6;--sign:#2fa862;--signink:#14532d;--new:#c0392b;--go:#c77d00;--done:#2e7d4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c16;--card:#17281f;--ink:#eaf5ee;--mute:#9bb8a8;--line:#2a4337;--sign:#3ecf7a;--signink:#0b2a18;--new:#ff7a6b;--go:#ffb84d;--done:#5fcf8f}}
:root[data-theme="dark"]{--bg:#0f1c16;--card:#17281f;--ink:#eaf5ee;--mute:#9bb8a8;--line:#2a4337;--sign:#3ecf7a;--signink:#0b2a18;--new:#ff7a6b;--go:#ffb84d;--done:#5fcf8f}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri','Noto Sans Bengali','Nirmala UI',sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 48px}
header{background:var(--signink);color:#fff;margin:0 -16px 20px;padding:22px 16px 18px;border-bottom:6px solid var(--sign)}
h1{margin:0;font-size:30px;line-height:1.2;font-weight:700}
header p{margin:6px 0 0;font-weight:500}
h2{font-size:19px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:20px}
label{display:block;font-weight:500;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:84px;resize:vertical}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:8px}
.primary{margin-top:16px;width:100%;background:var(--signink);color:#fff;border:0;padding:12px;font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .primary{background:var(--sign);color:var(--signink)}}
.err{color:var(--new);margin:8px 0 0;min-height:1.4em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{font-size:14px;color:var(--mute)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:5px 12px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--signink);color:#fff;border-color:var(--signink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--sign);color:var(--signink);border-color:var(--sign)}}
.item{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--new);border-radius:10px;padding:14px;margin-bottom:12px}
.item.go{border-left-color:var(--go)}.item.done{border-left-color:var(--done)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kind{font-weight:700}
.badge{font-size:14px;font-weight:700;white-space:nowrap}
.new .badge,.badge.new{color:var(--new)}.badge.go{color:var(--go)}.badge.done{color:var(--done)}
.place{color:var(--mute);margin:2px 0 6px}
.meta{font-size:14px;color:var(--mute);margin-top:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acts button{background:transparent;color:var(--ink);border:1px solid var(--line);padding:4px 10px;font-size:14px}
.acts .del{color:var(--new);margin-left:auto}
.empty{text-align:center;color:var(--mute);padding:24px 8px;border:1px dashed var(--line);border-radius:10px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .4s}.barlbl{font-size:14px;color:var(--mute);margin:6px 0 14px}.gps{margin-top:8px;background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 12px;font-size:15px}.tag{background:var(--new);color:#fff;border-radius:6px;padding:0 8px;font-size:13px;font-weight:700;margin-right:6px}.pic{display:block;max-width:100%;max-height:220px;border-radius:8px;margin-top:8px}.acts a{color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:14px;text-decoration:none}.acts button.on{background:var(--sign);color:var(--signink);border-color:var(--sign)}.row{display:flex;gap:8px}.row>*{flex:1}.notes{margin:8px 0 0;padding:6px 0 0;list-style:none;font-size:14px;border-top:1px dashed var(--line)}.notes li{padding:3px 0}.ic{margin-right:6px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tools button,.btnl{display:inline-block;margin:0;font-weight:400;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:8px 12px;font-size:15px;cursor:pointer;border-radius:8px}.wrap>p.note{font-size:14px;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>পাড়ার সমস্যা</h1>
  <p>রাস্তা, আলো, ময়লা, পানি, যা-ই হোক, জানান। সবাই এক জায়গায় দেখুন।</p>
</header>

<section class="card" aria-labelledby="fh">
  <h2 id="fh">নতুন সমস্যা জানান</h2>
  <label for="kind">সমস্যার ধরন</label>
  <select id="kind">
    <option>রাস্তা ভাঙা বা গর্ত</option>
    <option>লাইটপোস্টের আলো নষ্ট</option>
    <option>নর্দমা জমে আছে</option>
    <option>ময়লা পড়ে আছে</option>
    <option>পানি বা কল সমস্যা</option>
    <option>বিদ্যুৎ সমস্যা</option>
    <option>অন্যান্য</option>
  </select>
  <label for="place">জায়গার নাম</label>
  <input id="place" placeholder="যেমন: স্কুল মোড়, ৩ নম্বর গলি" maxlength="80">
  <button type="button" class="gps" id="gps">আমার অবস্থান ব্যবহার করুন</button>
  <label for="desc">বিবরণ</label>
  <textarea id="desc" placeholder="কী হয়েছে আর কতদিন ধরে, সংক্ষেপে লিখুন" maxlength="400"></textarea>
  <label for="urg">কতটা জরুরি</label>
  <select id="urg"><option value="0">সাধারণ</option><option value="1">জরুরি</option></select>
  <label for="pic">ছবি (না দিলেও চলবে)</label>
  <input id="pic" type="file" accept="image/*">
  <label for="ph">ফোন নম্বর (না দিলেও চলবে)</label>
  <input id="ph" type="tel" inputmode="tel" maxlength="20">
  <label for="who">আপনার নাম (না দিলেও চলবে)</label>
  <input id="who" maxlength="40">
  <p class="err" id="err" role="alert"></p>
  <button class="primary" id="add">সমস্যা জমা দিন</button>
</section>

<section aria-labelledby="lh">
  <h2 id="lh">সব সমস্যা</h2>
  <div class="stats">
    <div class="stat"><b id="c-new">0</b><span>নতুন</span></div>
    <div class="stat"><b id="c-go">0</b><span>চলছে</span></div>
    <div class="stat"><b id="c-done">0</b><span>সমাধান</span></div>
  </div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div><p class="barlbl" id="barlbl"></p><p class="barlbl" id="top" style="margin-top:-8px"></p>
  <input id="q" type="search" placeholder="জায়গা বা বিবরণ দিয়ে খুঁজুন" style="margin-bottom:12px">
  <div class="row" style="margin-bottom:12px"><select id="st" aria-label="স্ট্যাটাস"><option value="all">সব স্ট্যাটাস</option><option value="new">নতুন</option><option value="go">চলছে</option><option value="done">সমাধান হয়েছে</option></select><select id="so" aria-label="সাজান"><option value="a">জরুরি আগে</option><option value="v">ভোট বেশি আগে</option><option value="n">নতুন আগে</option></select></div>
  <div class="filters" id="filters" role="group" aria-label="ফিল্টার"></div>
  <div id="list"></div>
</section>

<div class="tools"><button id="rp">রিপোর্ট বানান</button><button id="bk">ব্যাকআপ সেভ করুন</button><label class="btnl">ব্যাকআপ ফিরিয়ে আনুন<input id="rs" type="file" accept=".json,application/json" hidden></label></div>
<textarea id="rep" readonly hidden style="min-height:180px;margin-bottom:16px"></textarea>
<p class="note">এই সংস্করণে তথ্য শুধু আপনার এই ব্রাউজারেই জমা থাকে। অন্যের ফোনে দেখা যাবে না।</p>
</div>

<script>
var KEY='para-somossa-v1';
var STATUS={new:'নতুন',go:'চলছে',done:'সমাধান হয়েছে'};
var items=[],filter='all',voted={},picData='',geo=null,VK='para-somossa-votes';
try{voted=JSON.parse(localStorage.getItem(VK))||{}}catch(e){}
var noteFor=null;
function icon(k){var m=[['রাস্তা','🕳️'],['আলো','💡'],['নর্দমা','🌊'],['ময়লা','🗑️'],['পানি','💧'],['বিদ্যুৎ','⚡']];for(var j=0;j<m.length;j++)if(k.indexOf(m[j][0])>=0)return m[j][1];return '📍'}
function age(i){var d=Math.floor((Date.now()-i.t)/86400000);return '<div class="meta">'+(d<1?'আজ জানানো হয়েছে':d+' দিন ধরে অমীমাংসিত')+(d>=7?' ⚠️':'')+'</div>'}
function saveV(){try{localStorage.setItem(VK,JSON.stringify(voted))}catch(e){}}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){items=JSON.parse(r);return}}catch(e){}
  var t=Date.now();
  items=[
    {id:1,kind:'লাইটপোস্টের আলো নষ্ট',place:'পুকুরপাড় মোড়',desc:'গত এক সপ্তাহ ধরে আলো জ্বলছে না, রাতে চলাচলে ভয় লাগে।',who:'নমুনা',status:'new',t:t-86400000*2},
    {id:2,kind:'রাস্তা ভাঙা বা গর্ত',place:'বাজারের পেছনের রাস্তা',desc:'বড় গর্তে বৃষ্টির পানি জমে, রিকশা উল্টে যাচ্ছে।',who:'নমুনা',status:'go',t:t-86400000*5}
  ];
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(t){try{return new Date(t).toLocaleDateString('bn-BD',{day:'numeric',month:'long'})}catch(e){return ''}}
function render(){
  ['new','go','done'].forEach(function(s){document.getElementById('c-'+s).textContent=items.filter(function(i){return i.status===s}).length});
  var dn=items.filter(function(i){return i.status==='done'}).length,pc=items.length?Math.round(dn*100/items.length):0;
  document.getElementById('bar').style.width=pc+'%';
  var cnt={},tk='',tn=0;items.forEach(function(i){if(i.status!=='done'){cnt[i.kind]=(cnt[i.kind]||0)+1;if(cnt[i.kind]>tn){tn=cnt[i.kind];tk=i.kind}}});
  document.getElementById('top').textContent=tn?('সবচেয়ে বেশি অমীমাংসিত: '+tk+' ('+tn+'টি)'):'';
  document.getElementById('barlbl').textContent=items.length?('মোট '+items.length+'টির মধ্যে '+dn+'টি সমাধান হয়েছে ('+pc+'%)'):'';
  var kinds=[];items.forEach(function(i){if(kinds.indexOf(i.kind)<0)kinds.push(i.kind)});
  if(filter!=='all'&&kinds.indexOf(filter)<0)filter='all';
  var f=document.getElementById('filters');
  f.innerHTML=['all'].concat(kinds).map(function(k){
    return '<button class="chip" data-k="'+esc(k)+'" aria-pressed="'+(filter===k)+'">'+(k==='all'?'সব':esc(k))+'</button>'}).join('');
  var q=(document.getElementById('q').value||'').trim().toLowerCase();
  var stv=document.getElementById('st').value;
  var shown=items.filter(function(i){return (filter==='all'||i.kind===filter)&&(stv==='all'||i.status===stv)&&(!q||(i.place+' '+i.desc+' '+i.kind).toLowerCase().indexOf(q)>=0)}).sort(function(a,b){var so=document.getElementById('so').value;if(so==='v')return (b.votes||0)-(a.votes||0)||b.t-a.t;if(so==='a')return (b.urg||0)-(a.urg||0)||b.t-a.t;return b.t-a.t});
  var l=document.getElementById('list');
  if(!shown.length){l.innerHTML='<div class="empty">এখনো কোনো সমস্যা জানানো হয়নি। উপরের ফর্ম থেকে প্রথমটি জমা দিন।</div>';return}
  l.innerHTML=shown.map(function(i){
    var btns=['new','go','done'].filter(function(s){return s!==i.status}).map(function(s){
      return '<button data-id="'+i.id+'" data-s="'+s+'">'+(s==='done'?'সমাধান হয়েছে':s==='go'?'কাজ চলছে':'নতুন করুন')+'</button>'}).join('');
    return '<article class="item '+i.status+'"><div class="top"><span class="kind">'+(i.urg?'<span class="tag">জরুরি</span>':'')+'<span class="ic">'+icon(i.kind)+'</span>'+esc(i.kind)+'</span><span class="badge '+i.status+'">'+STATUS[i.status]+'</span></div>'
      +'<div class="place">'+esc(i.place)+(i.geo?' &middot; <a href="https://www.google.com/maps?q='+i.geo+'" target="_blank" rel="noopener">মানচিত্রে দেখুন</a>':'')+'</div>'
      +(i.desc?'<div>'+esc(i.desc)+'</div>':'')+(i.pic?'<img class="pic" alt="সমস্যার ছবি" src="'+i.pic+'">':'')
      +'<div class="meta">'+esc(i.who||'নাম নেই')+' &middot; '+fmt(i.t)+'</div>'
      +(i.status!=='done'?age(i):'')+(i.notes&&i.notes.length?'<ul class="notes">'+i.notes.map(function(n){return '<li>'+esc(n.x)+' <span style="color:var(--mute)">('+fmt(n.t)+')</span></li>'}).join('')+'</ul>':'')+(noteFor===String(i.id)?'<div class="row" style="margin-top:8px"><input id="ni" maxlength="200" placeholder="আপডেট লিখুন"><button class="gps" style="margin:0;flex:0 0 auto" data-ns="'+i.id+'">সেভ করুন</button></div>':'')+'<div class="acts"><button class="vote'+(voted[i.id]?' on':'')+'" data-v="'+i.id+'">আমারও এই সমস্যা ('+(i.votes||0)+')</button><a href="https://wa.me/?text='+encodeURIComponent('পাড়ার সমস্যা: '+i.kind+', '+i.place+(i.desc?' - '+i.desc:''))+'" target="_blank" rel="noopener">হোয়াটসঅ্যাপে শেয়ার</a>'+(i.ph?'<a href="tel:'+esc(i.ph)+'">ফোন করুন</a>':'')+btns+'<button data-n="'+i.id+'">মন্তব্য লিখুন</button><button class="del" data-del="'+i.id+'">মুছুন</button></div></article>'}).join('');
}
document.getElementById('add').onclick=function(){
  var place=document.getElementById('place').value.trim(),err=document.getElementById('err');
  if(!place){err.textContent='জায়গার নাম লিখুন, তাহলে সবাই বুঝতে পারবে সমস্যাটা কোথায়।';document.getElementById('place').focus();return}
  err.textContent='';
  items.push({id:Date.now(),kind:document.getElementById('kind').value,place:place,desc:document.getElementById('desc').value.trim(),who:document.getElementById('who').value.trim(),ph:document.getElementById('ph').value.trim(),urg:+document.getElementById('urg').value,votes:0,pic:picData,geo:geo,status:'new',t:Date.now()});
  save();
  ['place','desc','who','ph','pic'].forEach(function(id){document.getElementById(id).value=''});picData='';geo=null;document.getElementById('urg').value='0';document.getElementById('gps').textContent='আমার অবস্থান ব্যবহার করুন';
  filter='all';render();
  document.getElementById('lh').scrollIntoView({behavior:'smooth'});
};
document.getElementById('filters').onclick=function(e){var k=e.target.getAttribute('data-k');if(k){filter=k;render()}};
document.getElementById('list').onclick=function(e){
  var s=e.target.getAttribute('data-s'),id=e.target.getAttribute('data-id'),d=e.target.getAttribute('data-del');
  var nn=e.target.getAttribute('data-n'),ns=e.target.getAttribute('data-ns');
  if(nn){noteFor=nn;render();var ni=document.getElementById('ni');if(ni)ni.focus();return}
  if(ns){var tx=(document.getElementById('ni')||{value:''}).value.trim();if(tx)items.forEach(function(i){if(String(i.id)===ns){(i.notes=i.notes||[]).push({x:tx,t:Date.now()})}});noteFor=null;save();render();return}
  var v=e.target.getAttribute('data-v');
  if(v){items.forEach(function(i){if(String(i.id)===v){if(voted[v]){i.votes=Math.max(0,(i.votes||0)-1);delete voted[v]}else{i.votes=(i.votes||0)+1;voted[v]=1}}});save();saveV();render()}
  else if(s){items.forEach(function(i){if(String(i.id)===id)i.status=s});save();render()}
  else if(d&&confirm('এই সমস্যাটি মুছে ফেলবেন?')){items=items.filter(function(i){return String(i.id)!==d});save();render()}
};
document.getElementById('q').oninput=render;
document.getElementById('rp').onclick=function(){var o=items.filter(function(i){return i.status!=='done'}).sort(function(a,b){return (b.urg||0)-(a.urg||0)||(b.votes||0)-(a.votes||0)});var t='পাড়ার সমস্যার রিপোর্ট ('+fmt(Date.now())+')\nমোট: '+items.length+', অমীমাংসিত: '+o.length+', সমাধান: '+(items.length-o.length)+'\n\n';o.forEach(function(i,n){t+=(n+1)+'. '+(i.urg?'[জরুরি] ':'')+i.kind+' - '+i.place+(i.votes?' ('+i.votes+' জনের সমর্থন)':'')+'\n'});var r=document.getElementById('rep');r.hidden=false;r.value=t;r.select();try{navigator.clipboard.writeText(t)}catch(e){}};
document.getElementById('bk').onclick=async function(){var b=this;try{var d=window.claude?await claude.use('downloads'):null;if(!d){b.textContent='এখানে ব্যাকআপ সেভ চলবে না';return}await d.save({filename:'para-somossa-backup.json',data:new Blob([JSON.stringify(items)],{type:'application/json'})})}catch(e){}};
document.getElementById('rs').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var a=JSON.parse(r.result);if(Array.isArray(a)&&a.every(function(x){return x&&x.kind&&x.place})){items=a;save();render()}}catch(e){}};r.readAsText(f)};
document.getElementById('st').onchange=render;document.getElementById('so').onchange=render;
document.getElementById('pic').onchange=function(){var f=this.files[0];picData='';if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var sc=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);picData=c.toDataURL('image/jpeg',0.6)};im.src=r.result};r.readAsDataURL(f)};
document.getElementById('gps').onclick=function(){var b=this;if(!navigator.geolocation){b.textContent='এই ব্রাউজারে অবস্থান পাওয়া যায় না';return}b.textContent='খোঁজা হচ্ছে...';navigator.geolocation.getCurrentPosition(function(p){geo=p.coords.latitude.toFixed(5)+','+p.coords.longitude.toFixed(5);var pl=document.getElementById('place');if(!pl.value)pl.value='আমার বর্তমান অবস্থান';b.textContent='অবস্থান যোগ হয়েছে ✓'},function(){b.textContent='অবস্থান পাওয়া যায়নি, অনুমতি দিন'},{timeout:10000})};
load();render();
</script>
</body>
